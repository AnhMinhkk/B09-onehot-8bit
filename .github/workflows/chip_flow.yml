name: RTL Simulation and OpenLane GDS Flow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run Simulation
        run: |
          iverilog -g2012 -o b09_sim b09_onehot_binary.sv b09_reference.sv b09_tb.sv
          vvp b09_sim

  gds_and_render:
    needs: simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Design Folder
        run: |
          mkdir -p designs/b09_onehot_binary/src
          cp b09_onehot_binary.sv designs/b09_onehot_binary/src/

      - name: Run OpenLane via Docker
        run: |
          docker run --rm \
            -v $(pwd)/designs/b09_onehot_binary:/openlane/designs/b09_onehot_binary \
            -w /openlane \
            efabless/openlane:2023.11.03 bash -c "pip install --no-cache-dir volare && volare enable && ./flow.tcl -design b09_onehot_binary"
          sudo chmod -R 777 designs/

      - name: Install KLayout Python Bindings and Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-klayout xvfb

      - name: Render Layout Image
        run: |
          export QT_QPA_PLATFORM=offscreen
          xvfb-run python3 render_gds.py

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gds-and-layout-results
          if-no-files-found: warn
          path: |
            b09_layout.png
            designs/b09_onehot_binary/runs/*/results/final/gds/*.gds
